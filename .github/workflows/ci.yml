name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm test -- --reporter=dot
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Backend type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend

  integration:
    name: Docker API integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start isolated application stack
        run: docker compose -p tess-pos-ci up --build -d
      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose -p tess-pos-ci logs
          exit 1
      - name: Test live API workflows
        run: node backend/scripts/integration-test.mjs
      - name: Stop isolated application stack
        if: always()
        run: docker compose -p tess-pos-ci down -v
